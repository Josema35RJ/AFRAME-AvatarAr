<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Avatar</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>

  <script>

    AFRAME.registerComponent('ar-placer', {
      init: function () {
        this.placed = false;
        this.scene  = this.el.sceneEl;
        this.ui     = document.getElementById('ui-overlay');

        this.scene.addEventListener('enter-vr', () => {
          if (!this.scene.is('ar-mode')) return;
          if (this.ui) this.ui.style.display = 'flex';
        });

        this.scene.addEventListener('exit-vr', () => {
          if (this.ui) this.ui.style.display = 'none';
        });

        this.scene.addEventListener('ar-hit-test-select', () => {
          if (!this.placed) {
            this.placed = true;
            this.updateUI('placed');
          }
        });

        const btn = document.getElementById('btn-reset');
        if (btn) btn.addEventListener('click', this.reset.bind(this));
      },

      reset: function () {
        this.placed = false;
        this.el.setAttribute('visible', 'false');
        this.updateUI('idle');
      },

      updateUI: function (state) {
        const tip = document.getElementById('ui-tip');
        const btn = document.getElementById('btn-reset');
        if (!tip) return;
        if (state === 'placed') {
          tip.textContent = 'Toca de nuevo para mover el avatar';
          if (btn) btn.style.display = 'inline-block';
        } else {
          tip.textContent = 'Apunta al suelo y toca para colocar';
          if (btn) btn.style.display = 'none';
        }
      }
    });
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }

    #ui-overlay {
      display: none;
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 999;
      pointer-events: none;
    }
    #ui-tip {
      background: rgba(0,0,0,0.55);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      backdrop-filter: blur(8px);
    }
    #btn-reset {
      display: none;
      pointer-events: all;
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.4);
      padding: 7px 20px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>

  <div id="ui-overlay">
    <span id="ui-tip">Apunta al suelo y toca para colocar</span>
    <button id="btn-reset">Quitar avatar</button>
  </div>

  -->
  <a-scene
    webxr="requiredFeatures: hit-test,local-floor; optionalFeatures: dom-overlay,light-estimation; overlayElement: #ui-overlay"
    ar-hit-test="target: #avatar-entity"
    renderer="colorManagement: true; antialias: true; exposure: 1.2; toneMapping: ACESFilmic"
    shadow="type: pcfsoft; autoUpdate: true"
    loading-screen="dotsColor: white; backgroundColor: black"
  >

    <a-assets timeout="10000">
      <a-asset-item id="avatarAsset"
        src="https://cdn.jsdelivr.net/gh/Josema35RJ/Avatar@main/3dpea.com_Salute.glb">
      </a-asset-item>
    </a-assets>

    <a-entity id="ar-hit-test-reticle" visible="false">
      <a-ring
        color="#00FF00"
        radius-inner="0.06"
        radius-outer="0.11"
        rotation="-90 0 0"
        material="shader: flat; side: double; depthTest: false">
      </a-ring>
      <a-ring
        color="#ffffff"
        radius-inner="0.02"
        radius-outer="0.05"
        rotation="-90 0 0"
        material="shader: flat; side: double; opacity: 0.55; transparent: true; depthTest: false">
      </a-ring>
    </a-entity>
    
    <a-entity
      id="avatar-entity"
      gltf-model="#avatarAsset"
      ar-placer
      anchored
      scale="1.2 1.2 1.2"
      visible="false"
      animation-mixer="clip: *; loop: repeat"
      shadow="cast: true; receive: false"
    >
      <a-plane
        position="0 0.001 0"
        rotation="-90 0 0"
        width="2.5" height="2.5"
        material="shader: flat; color: #000; opacity: 0.18; transparent: true; depthWrite: false; side: double">
      </a-plane>
    </a-entity>

    <a-entity camera position="0 1.6 0"></a-entity>

    <a-light
      type="hemisphere"
      color="#ddeeff"
      ground-color="#8B7355"
      intensity="0.65">
    </a-light>

    <a-light
      type="directional"
      color="#fff8f0"
      intensity="1.1"
      position="2 6 3"
      cast-shadow="true"
      shadow-map-size="2048 2048"
      shadow-camera-left="-3"
      shadow-camera-right="3"
      shadow-camera-top="3"
      shadow-camera-bottom="-3"
      shadow-bias="-0.0005">
    </a-light>

    <a-light
      type="point"
      color="#c8d8ff"
      intensity="0.35"
      distance="8"
      decay="2"
      position="-3 2 -2">
    </a-light>

  </a-scene>
</body>
</html>
