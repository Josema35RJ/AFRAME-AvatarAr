<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Avatar AR GitHub Pages</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <script>
    AFRAME.registerComponent('ar-placer', {
      init: function () {
        const reticle = document.getElementById('reticle');
        const avatar = this.el;

        this.el.sceneEl.addEventListener('enter-vr', () => {
          if (this.el.sceneEl.is('ar-mode')) {
            reticle.setAttribute('visible', 'true');
          }
        });

        reticle.addEventListener('select', () => {
          // Copiamos la posición actual del reticle
          const position = reticle.getAttribute('position');
          
          avatar.setAttribute('position', position);
          avatar.setAttribute('visible', 'true');
          
        });
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>

<body>
  <a-scene
    webxr="requiredFeatures: hit-test, local-floor;"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    shadow="type: pcfsoft"
  >
    <a-assets>
      <a-asset-item id="avatarAsset" src="https://cdn.jsdelivr.net/gh/Josema35RJ/Avatar@main/3dpea.com_Salute.glb"></a-asset-item>
      <a-asset-item id="reticleAsset" src="https://cdn.jsdelivr.net/gh/Josema35RJ/Avatar@main/reticle.glb"></a-asset-item>
    </a-assets>

    <a-entity
      id="reticle"
      gltf-model="#reticleAsset"
      scale="0.2 0.2 0.2"
      ar-hit-test
      visible="false"
      shadow="cast: false; receive: false"
    ></a-entity>

    <a-entity
      id="avatar-entity"
      gltf-model="#avatarAsset"
      ar-placer
      scale="1.2 1.2 1.2"
      visible="false"
      animation-mixer="clip: *; loop: repeat;"
      shadow="cast: true; receive: false"
    >
        <a-plane 
          position="0 0 0" 
          rotation="-90 0 0" 
          width="3" height="3" 
          shadow="receive: true" 
          material="opacity: 0.3; transparent: true; color: #000000; depthWrite: false;">
        </a-plane>
    </a-entity>

    <a-entity camera position="0 1.6 0"></a-entity>

    <a-light type="ambient" intensity="0.5" color="#ffffff"></a-light>
    <a-light type="directional" intensity="0.8" position="1 4 2" castShadow="true" shadow-mapSize="1024 1024"></a-light>
  </a-scene>
</body>
</html>
